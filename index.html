<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Werwolf</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #202124;
    }
    h1 { color: #1f1f1f; margin-bottom: 0.5rem; }
    p { color: #5f6368; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #1f1f1f;
      color: #fff;
      text-decoration: none;
      border-radius: 24px;
      font-weight: 600;
    }
    a:hover { background: #2b2b2b; }
    code { background: #e8eaed; padding: 2px 8px; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>🐺 Werwolf</h1>
  <p>Digitale Unterstützung für die Spielrunde.</p>
  <p>Die App läuft im <strong>Frontend</strong>. Im Projektordner:</p>
  <p><code>cd frontend && npm install && npm run dev</code></p>
  <p>Dann im Browser: <a href="http://localhost:5173">http://localhost:5173</a></p>
  <p style="font-size: 0.9rem; color: #9aa0a6;">Backend zuerst starten: <code>cd backend && npm start</code></p>
</body>
</html>

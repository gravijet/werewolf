<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Werwolf – digitale Spielleitung für eure Runde. Echtzeit, mobil, mehrsprachig." />
    <meta name="theme-color" content="#1b6ef3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Werwolf" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <title>Werwolf</title>
    <script>
      // Gespeichertes Theme früh anwenden, um helles Aufblitzen im Dark Mode zu vermeiden.
      (function () {
        try {
          var t = localStorage.getItem("werwolf_theme");
          document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
          document.documentElement.dataset.phase = "lobby";
        } catch (e) {}
      })();
    </script>
    <style>
      /* Hintergrund passend zum Theme, damit der erste Frame nicht weiß blitzt. */
      html[data-theme="dark"] { background: #111318; }
      html { background: #fdfbff; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
